[package]
name = "local_server_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = "0.16.1"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
local-ip-address = "0.6.13"
mime_guess = "2.0.5"
percent-encoding = "2.3.2"
qrcode = { version = "0.14.1", default-features = false }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "fs", "signal"] }
tokio-util = { version = "0.7.20", features = ["io"] }

[dev-dependencies]
tempfile = "3.27.0"
